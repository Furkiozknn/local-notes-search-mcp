[project]
name = "local-notes-search-mcp"
version = "0.1.0"
description = "Semantic search (and optional LLM Q&A) over your own local files as an MCP server - sqlite-vec + a local ONNX embedding model. Indexing/search need zero servers and zero API keys; ask_notes' LLM synthesis is opt-in via GROQ_API_KEY/MISTRAL_API_KEY."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Furki Ozkan" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "semantic-search",
    "embeddings",
    "notes",
    "rag",
    "local-first",
    "claude",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.1,<3",
    "sqlite-vec>=0.1.6",
    # 0.6.0 is where the default model got mean pooling, the pooling its own
    # sentence-transformers config specifies; 0.4-0.5 used CLS pooling, whose
    # vectors are not comparable with 0.6+ ones (see embedder_id()).
    "fastembed>=0.6.0",
    "pydantic>=2",
    # 1.98.0-1.100.x import typing.NotRequired, which Python 3.10 does not
    # have: on 3.10 `import litellm` failed and ask_notes silently degraded to
    # raw chunks. 1.101.0 is the first release that imports on 3.10 again.
    "litellm>=1.101.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
local-notes-search-mcp = "local_notes_search:main"

[tool.setuptools]
# Single-file MCP server, not a package - same fix nvidia-nim-mcp and
# voice-io-mcp needed after setuptools' flat-layout auto-discovery broke the
# moment a second top-level directory existed (e.g. an index .db file's
# parent dir). Declaring the one real module explicitly skips discovery.
py-modules = ["local_notes_search"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
