<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="local-notes-search-mcp - semantic search over your own files, as an MCP server">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111a2b"/>
      <stop offset="100%" stop-color="#0b1f2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39d3bb"/>
      <stop offset="50%" stop-color="#4c8dff"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#39d3bb" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#39d3bb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="960" cy="150" r="230" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- document pages dissolving into an embedding constellation -->
  <g opacity="0.92">
    <g transform="translate(830,72) rotate(-9)">
      <rect width="112" height="146" rx="8" fill="#16202e" stroke="#2b3a4f" stroke-width="1.5"/>
      <rect x="16" y="22" width="72" height="6" rx="3" fill="#3a4d66"/>
      <rect x="16" y="40" width="80" height="6" rx="3" fill="#31435a"/>
      <rect x="16" y="58" width="56" height="6" rx="3" fill="#31435a"/>
      <rect x="16" y="76" width="76" height="6" rx="3" fill="#2b3a4f"/>
      <rect x="16" y="94" width="44" height="6" rx="3" fill="#2b3a4f"/>
    </g>
    <g transform="translate(884,96) rotate(6)" opacity="0.8">
      <rect width="112" height="146" rx="8" fill="#16202e" stroke="#2b3a4f" stroke-width="1.5"/>
      <rect x="16" y="22" width="66" height="6" rx="3" fill="#3a4d66"/>
      <rect x="16" y="40" width="80" height="6" rx="3" fill="#31435a"/>
      <rect x="16" y="58" width="50" height="6" rx="3" fill="#2b3a4f"/>
    </g>
  </g>

  <g stroke="#39d3bb" stroke-opacity="0.42" stroke-width="1.2" fill="none">
    <path d="M1000 120 L1060 84 L1128 112 L1092 176 L1016 186 Z"/>
    <path d="M1060 84 L1092 176"/>
    <path d="M1000 120 L1128 112"/>
    <path d="M1016 186 L1060 84"/>
    <path d="M1092 176 L1150 214"/>
    <path d="M1016 186 L978 246"/>
  </g>
  <g fill="#39d3bb">
    <circle cx="1000" cy="120" r="5"/>
    <circle cx="1060" cy="84" r="6.5"/>
    <circle cx="1128" cy="112" r="4.5"/>
    <circle cx="1092" cy="176" r="5.5"/>
    <circle cx="1016" cy="186" r="4"/>
    <circle cx="1150" cy="214" r="3.5" fill="#4c8dff"/>
    <circle cx="978" cy="246" r="3.5" fill="#a371f7"/>
  </g>

  <!-- magnifier mark -->
  <g transform="translate(72,108)" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round">
    <circle cx="38" cy="38" r="34"/>
    <path d="M63 63 L94 94"/>
  </g>

  <text x="176" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="46" font-weight="700" fill="#e6edf3">local-notes-search-mcp</text>
  <text x="178" y="172" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" fill="#8b98a9">Semantic search over your own files &#8212; as an MCP server.</text>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600">
    <g transform="translate(178,204)">
      <rect width="176" height="34" rx="17" fill="#0f2a24" stroke="#1f6f5c"/>
      <text x="88" y="22" text-anchor="middle" fill="#56d4b4">no API key to search</text>
    </g>
    <g transform="translate(366,204)">
      <rect width="176" height="34" rx="17" fill="#0f2130" stroke="#1f4f7a"/>
      <text x="88" y="22" text-anchor="middle" fill="#6cb6ff">offline retrieval</text>
    </g>
    <g transform="translate(554,204)">
      <rect width="176" height="34" rx="17" fill="#1c1730" stroke="#4a3b7a"/>
      <text x="88" y="22" text-anchor="middle" fill="#b394f7">optional LLM Q&amp;A</text>
    </g>
  </g>

  <text x="178" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#5c6b7f">sqlite-vec &#183; fastembed ONNX &#183; bge-small-en-v1.5 &#183; zero daemons &#183; MIT</text>
</svg>
