name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # olculen en uzun kosu 30 sn
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0

      - name: Install dependencies
        run: uv sync --group dev

      # Modeli her kosuda Hugging Face'ten yeniden indirmek yerine onbellekten
      # al. Anahtar model adini tasiyor: LOCAL_NOTES_SEARCH_MODEL varsayilani
      # degisirse onbellek kendiliginden yenilenir.
      - name: Embedding modeli onbellegi
        uses: actions/cache@v5
        with:
          path: ~/.cache/lns-model
          key: lns-model-paraphrase-multilingual-MiniLM-L12-v2-v1

      # LOCAL_NOTES_SEARCH_REQUIRE_MODEL=1: model yuklenemezse 14 model testi
      # sessizce "skipped" olup is yesil kalmasin, is kirmizi yansin.
      - name: Run tests
        env:
          LOCAL_NOTES_SEARCH_MODEL_DIR: ~/.cache/lns-model
          LOCAL_NOTES_SEARCH_REQUIRE_MODEL: "1"
        run: uv run pytest -v

  # pyproject 3.10-3.13 diyor; `test` yalniz .python-version'u (3.12) kosuyor.
  # Bu is olmadan 3.10'da `import litellm` kirildiginda (litellm 1.98-1.100
  # typing.NotRequired kullaniyor) ask_notes sessizce ham sonuca dusuyordu ve
  # hicbir kontrol bunu gormedi. Model burada da zorunlu: atlanan test yok.
  surumler:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10  # olculen en uzun kosu 27 sn
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0

      - name: Install dependencies
        run: uv sync --group dev --python ${{ matrix.python }}

      - name: Dogru Python mu
        run: uv run --python ${{ matrix.python }} python -c "import sys; v='%d.%d' % sys.version_info[:2]; assert v == '${{ matrix.python }}', v; print(v)"

      - name: Embedding modeli onbellegi
        uses: actions/cache@v5
        with:
          path: ~/.cache/lns-model
          key: lns-model-paraphrase-multilingual-MiniLM-L12-v2-v1

      - name: Run tests
        env:
          LOCAL_NOTES_SEARCH_MODEL_DIR: ~/.cache/lns-model
          LOCAL_NOTES_SEARCH_REQUIRE_MODEL: "1"
        run: uv run --python ${{ matrix.python }} pytest -q

  # `yayinla.yml` yalniz `v*` etiketinde kosuyor, yani paketleme bozulursa
  # bunu ancak yayinlamaya calistigin an ogrenirsin. Kardes depo mcp-vet'te
  # tam olarak bu oldu: 244 test yesilken `uv build` calismiyordu, cunku
  # hicbir sey paketlemeyi denemiyordu. Bu is onu her push'a tasiyor.
  paket:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # olculen en uzun kosu 13 sn
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0

      - name: Paket derleniyor mu
        run: uv build

      - name: Uretilen paket gecerli mi
        run: uvx twine check dist/*

      # Derlemenin basarili olmasi paketin icinde dogru dosyalarin oldugunu
      # kanitlamaz: eksik bir modul ya da yanlis bir giris noktasi ancak
      # kurulunca ortaya cikar.
      - name: Tekerlek kuruluyor ve giris noktasi yerinde
        run: |
          set -e
          uv venv /tmp/deneme
          VIRTUAL_ENV=/tmp/deneme uv pip install dist/*.whl
          test -x /tmp/deneme/bin/local-notes-search-mcp || { echo "konsol komutu uretilmedi: local-notes-search-mcp"; exit 1; }
          # Sunucu stdio'da sonsuza kadar bloke oldugu icin CALISTIRILMIYOR;
          # hedefin var ve cagrilabilir oldugu dogrulaniyor.
          VIRTUAL_ENV=/tmp/deneme /tmp/deneme/bin/python -c "import local_notes_search as m; assert callable(m.main), 'main cagrilabilir degil'"
          echo "local-notes-search-mcp kuruldu, giris noktasi cagrilabilir"

  denetim:
    name: mcp-vet (kendi sunucumuza kendi aracimiz)
    runs-on: ubuntu-latest
    timeout-minutes: 10  # olculen en uzun kosu 11 sn
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0

      # Ayni hesaptaki mcp-vet: bir MCP sunucusunun ne yapabildigini
      # kaynaktan cikariyor -- hangi kimlik bilgilerine dokunuyor, nereye
      # baglaniyor, ne calistiriyor. Kendi sunucumuzu kendi aracimizla
      # denetlemek, aracin da sunucunun da yanlis bulgusunu ortaya cikariyor:
      # bu is eklenirken mcp-vet'te gercek bir yanlis pozitif bulundu ve
      # duzeltildi (savunma amacli bir denylist, kimlik okumak sanilmisti).
      # Bilerek sabitlenmemis: kendi aracimizin en son halini kendi
      # sunucumuzda deniyoruz (mcp-vet'in etiketi yok). Is yalniz
      # `contents: read` ile ve sirsiz kosuyor; kapi asagida cikis >= 2.
      - name: mcp-vet'i kur
        run: uv tool install git+https://github.com/Furkiozknn/mcp-vet

      # --offline: ag yok, yalnizca kaynak analizi. Depo zaten burada.
      - name: Denetle
        run: |
          # Actions bu kabugu `-e` ile calistiriyor. `... | tee` boru hatti
          # LOW bulguda 1 donuyor ve `-e` betigi tam orada olduruyor -- yani
          # asagidaki `case` hic kosmuyordu ve LOW bir sunucu kirmizi yaniyordu.
          # Cikis kodu `|| kod=$?` ile aliniyor, cunku `||` olan bir komut
          # `-e` icin sinanmis sayiliyor.
          set -uo pipefail
          kod=0
          mcp-vet audit --offline --path . > /tmp/mcpvet.txt 2>&1 || kod=$?
          cat /tmp/mcpvet.txt
          {
            echo '### mcp-vet'
            echo ''
            echo '```'
            cat /tmp/mcpvet.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 0 temiz, 1 LOW/MEDIUM, 2 HIGH, 3 CRITICAL, 4 arac kosamadi.
          # Kapi HIGH ve uzerinde kapaniyor: LOW/MEDIUM bulgular bu sunucuda
          # gercek ve bilinen yetenekleri anlatiyor (dis surec calistirmak
          # gibi), onlari kirmiziya cevirmek kapiyi anlamsizlastirirdi.
          # Aracin kendisi kosamadiysa (4) bu da bir arizadir, yesil degil.
          case "$kod" in
            0|1) echo "gecti (cikis $kod)" ;;
            *)   echo "mcp-vet cikis $kod"; exit 1 ;;
          esac
